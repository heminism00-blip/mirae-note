<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>미래노트</title>
<meta name="theme-color" content="#0d9488" />
<link rel="icon" href="icon.png" />
<link rel="apple-touch-icon" href="icon.png" />
<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="미래노트" />
<style>
  :root{ --ink:#18181b; --sub:#71717a; --line:#e4e4e7; --bg:#fafaf9; --card:#fff; --soft:#f4f4f5;
         --accent:#0d9488; --accent-bg:#f0fdfa; --accent-bd:#99f6e4;
         --apply:#16a34a; --review:#d97706; --ref:#71717a; }
  @media (prefers-color-scheme: dark){
    :root{ --ink:#f4f4f5; --sub:#a1a1aa; --line:#3f3f46; --bg:#18181b; --card:#232326; --soft:#2e2e33;
           --accent:#2dd4bf; --accent-bg:#0f2e2a; --accent-bd:#155e56; }
    input,textarea,select{ background:#2e2e33 !important; }
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; background:var(--bg); color:var(--ink);
        font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
  .wrap{ max-width:560px; margin:0 auto; padding:16px 14px 60px; }
  h1{ font-size:22px; font-weight:800; letter-spacing:-.02em; margin:0 0 2px; }
  .lead{ font-size:12px; color:var(--sub); margin:0 0 14px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:10px; }
  label{ display:block; font-size:12px; color:var(--sub); margin:0 0 4px; }
  input,textarea,select{ width:100%; border:1px solid var(--line); border-radius:10px; padding:10px 12px;
        font-size:15px; background:#fff; color:var(--ink); outline:none; font-family:inherit; }
  input:focus,textarea:focus{ border-color:var(--accent); }
  textarea{ resize:vertical; min-height:96px; line-height:1.55; }
  .field{ margin-bottom:10px; }
  .btn{ border:1px solid var(--line); background:var(--soft); color:var(--ink); border-radius:9px;
        padding:9px 12px; font-size:14px; font-weight:600; cursor:pointer; }
  .btn.primary{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .btn.block{ width:100%; }
  .btn.sm{ padding:5px 9px; font-size:12px; }
  .row{ display:flex; gap:8px; }
  .chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .chip{ border:1px solid var(--line); background:var(--card); color:var(--sub); border-radius:999px;
         padding:5px 11px; font-size:12.5px; cursor:pointer; user-select:none; white-space:nowrap; }
  .seg{ display:flex; gap:6px; }
  .seg button{ flex:1; border:1px solid var(--line); background:var(--card); color:var(--sub);
        border-radius:9px; padding:8px; font-size:13px; font-weight:600; cursor:pointer; }
  .seg button.apply.on{ background:#f0fdf4; border-color:#bbf7d0; color:var(--apply); }
  .seg button.review.on{ background:#fffbeb; border-color:#fde68a; color:var(--review); }
  .seg button.ref.on{ background:#f4f4f5; border-color:#e4e4e7; color:var(--ref); }
  .stars{ font-size:22px; letter-spacing:3px; cursor:pointer; user-select:none; color:#d4d4d8; }
  .stars .on{ color:#f59e0b; }
  .thumb{ width:100%; border-radius:10px; display:block; aspect-ratio:16/9; object-fit:cover; background:var(--soft); }
  .thumb.sm{ width:108px; flex:0 0 108px; aspect-ratio:16/9; }
  /* 노트 카드 */
  .note{ background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; margin-bottom:10px; border-left-width:4px; }
  .note.apply{ border-left-color:var(--apply); } .note.review{ border-left-color:var(--review); } .note.ref{ border-left-color:var(--ref); }
  .note-top{ display:flex; gap:10px; padding:10px; cursor:pointer; }
  .note-body{ min-width:0; flex:1; }
  .note-title{ font-size:15px; font-weight:700; line-height:1.35; margin:2px 0 4px;
        display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .badge{ display:inline-block; font-size:11px; font-weight:700; padding:2px 7px; border-radius:6px; }
  .badge.apply{ background:#f0fdf4; color:var(--apply); } .badge.review{ background:#fffbeb; color:var(--review); } .badge.ref{ background:#f4f4f5; color:var(--ref); }
  .meta{ display:flex; flex-wrap:wrap; gap:5px; align-items:center; margin-top:5px; }
  .tag{ font-size:11px; border-radius:5px; padding:1px 7px; border:1px solid; font-weight:600; }
  /* 리포트 상세 */
  .det{ border-top:1px solid var(--line); padding:12px; background:var(--soft); }
  .rsec{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 13px; margin-bottom:10px; }
  .rsec h4{ margin:0 0 8px; font-size:13px; font-weight:800; color:var(--accent); padding-bottom:6px; border-bottom:1px solid var(--line); }
  .rsec ul{ margin:0; padding:0; list-style:none; }
  .rsec li{ margin:6px 0; font-size:14px; line-height:1.65; padding-left:16px; position:relative; }
  .rsec li:before{ content:'•'; color:var(--accent); position:absolute; left:2px; font-weight:700; }
  .rsec p{ margin:0; font-size:14px; line-height:1.7; white-space:pre-wrap; }
  .rline{ display:flex; gap:7px; align-items:flex-start; margin:6px 0; font-size:14px; line-height:1.65; }
  .rline .rtxt{ flex:1; min-width:0; }
  .rline .pin{ flex:0 0 auto; cursor:pointer; color:#cbd5e1; font-size:14px; user-select:none; padding:0 2px; }
  .rline .pin.on{ color:#f59e0b; }
  .fhead{ font-weight:800; color:var(--accent); display:block; margin:12px 0 4px; font-size:13.5px; }
  .acts{ display:flex; gap:8px; margin-top:4px; }
  .toolbar{ display:flex; gap:8px; align-items:center; margin:6px 0 4px; }
  .toolbar select{ flex:0 0 auto; width:auto; padding:7px 10px; font-size:13px; }
  .count{ font-size:12px; color:var(--sub); margin:4px 2px 8px; }
  .empty{ text-align:center; color:var(--sub); font-size:13px; padding:30px 0; }
  .foot{ text-align:center; font-size:11px; color:var(--sub); margin-top:16px; line-height:1.7; }
  .foot a{ color:var(--accent); font-weight:600; }
  .tabs{ display:flex; gap:6px; margin-bottom:12px; }
  .tabs button{ flex:1; border:1px solid var(--line); background:var(--card); color:var(--sub); border-radius:10px; padding:9px; font-size:14px; font-weight:700; cursor:pointer; }
  .tabs button.on{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .termchip{ display:inline-flex; align-items:center; gap:4px; border:1px solid var(--accent-bd); background:var(--accent-bg); color:var(--accent); border-radius:999px; padding:4px 10px; font-size:12px; cursor:pointer; }
  .termchip.saved{ opacity:.5; }
  .tdef{ font-size:11px; color:var(--sub); margin:2px 0 6px 2px; }
  .gword{ font-weight:700; } .gdef{ color:var(--sub); font-size:13px; }
  .gitem{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:8px; display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
</style>
</head>
<body>
<div class="wrap">
  <h1>미래노트</h1>
  <p class="lead">영상·자료를 담으면 AI가 분류·요약·인사이트·적용안으로 정리. 지금 보고, 미래에 적용.</p>
  <div class="tabs"><button id="tabNotes" class="on">📝 노트</button><button id="tabScrap">📌 스크랩</button><button id="tabGloss">📚 용어장</button></div>

  <button id="openAdd" class="btn primary block" style="margin-bottom:8px">+ 새 노트 추가</button>
  <div style="font-size:11px;color:var(--sub);margin:-2px 0 12px;text-align:center">💡 유튜브에서 <b>공유 → 미래노트</b> 하면 링크가 자동으로 들어와요 (홈 화면 추가 후)</div>

  <div class="card" id="form" style="display:none">
    <div class="field">
      <label>링크 (유튜브·기사 등)</label>
      <div class="row">
        <input id="n_url" type="url" inputmode="url" placeholder="https://..." />
        <button class="btn" id="fetchBtn" style="flex:0 0 auto">불러오기</button>
      </div>
      <div id="fetchMsg" style="font-size:11px;color:var(--sub);margin-top:4px"></div>
      <button class="btn primary block" id="aiBtn" style="margin-top:8px">✨ AI로 자동 정리 (분류·요약·인사이트·적용)</button>
      <div id="aiMsg" style="font-size:11px;color:var(--sub);margin-top:4px"></div>
    </div>
    <img id="n_thumb" class="thumb" style="display:none;margin-bottom:10px" />
    <div class="field"><label>제목</label><input id="n_title" type="text" placeholder="영상/자료 제목" /></div>
    <div class="field"><label>카테고리 (AI 자동·수정 가능)</label><div class="chips" id="catPick"></div></div>
    <div class="field"><label>중요도</label>
      <div class="stars" id="starPick" data-v="0"><span data-i="1">★</span><span data-i="2">★</span><span data-i="3">★</span></div>
    </div>
    <div class="field"><label>3줄 요점 (한 줄에 하나)</label><textarea id="n_summary" placeholder="AI가 채우거나 직접 입력"></textarea></div>
    <div class="field"><label>인사이트</label><textarea id="n_insight" placeholder="얻은 인사이트"></textarea></div>
    <div class="field"><label>실제 적용안 (액션)</label><textarea id="n_action" placeholder="이렇게 적용"></textarea></div>
    <div class="field"><label>📜 전체 내용 (AI 상세본)</label><textarea id="n_full" placeholder="AI가 영상 전체를 풀어서 정리" style="min-height:140px"></textarea></div>
    <div class="field" id="termPickWrap" style="display:none"><label>💡 기억할 용어 (➕ 누르면 용어장에 누적)</label><div class="chips" id="termPick"></div></div>
    <div class="field"><label>적용 상태</label>
      <div class="seg" id="statusPick">
        <button data-s="apply" class="apply">🟢 적용</button>
        <button data-s="review" class="review on">🟡 적용 검토</button>
        <button data-s="ref" class="ref">⚪ 단순 참고</button>
      </div>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="btn primary block" id="saveBtn">저장</button>
      <button class="btn" id="cancelBtn" style="flex:0 0 auto">취소</button>
    </div>
  </div>

  <div class="field" style="margin-bottom:6px"><input id="search" type="text" placeholder="🔎 제목·내용 검색" /></div>
  <div class="chips" id="statusFilter" style="margin-bottom:6px">
    <span class="chip on" data-s="all">전체</span>
    <span class="chip" data-s="review">🟡 적용 검토</span>
    <span class="chip" data-s="apply">🟢 적용</span>
    <span class="chip" data-s="ref">⚪ 참고</span>
  </div>
  <div class="chips" id="catFilter" style="margin-bottom:6px"></div>
  <div class="toolbar">
    <select id="sortSel">
      <option value="recent">최신순</option>
      <option value="views">자주 본 순</option>
      <option value="importance">중요도순</option>
      <option value="status">상태순(검토→적용→참고)</option>
    </select>
    <span class="count" id="count" style="margin:0"></span>
  </div>

  <div id="notesView">
  <div id="list"></div>
  </div>
  <div id="glossView" style="display:none">
    <div class="field"><input id="gsearch" type="text" placeholder="🔎 용어 검색" /></div>
    <div class="count" id="gcount"></div>
    <div id="glist"></div>
  </div>
  <div id="scrapView" style="display:none">
    <div style="font-size:12px;color:var(--sub);margin-bottom:8px">카드 펼쳐서 줄 옆 📌 누르면 그 문장이 여기 분야별로 모여요.</div>
    <div class="field"><input id="ssearch" type="text" placeholder="🔎 스크랩 검색" /></div>
    <div class="count" id="scount"></div>
    <div id="slist"></div>
  </div>

  <div class="foot">데이터·AI키는 이 브라우저에만 저장돼요. 기기 바꾸면 안 넘어가니 백업으로 옮기세요.<br>
    <a href="#" id="exportBtn">📤 내보내기(백업)</a> · <a href="#" id="importBtn">📥 가져오기(복원)</a> · <a href="#" id="keyBtn">🔑 AI 키</a>
    <input id="importFile" type="file" accept="application/json,.json" style="display:none" />
  </div>
</div>

<script>
(function(){
  // ── 설정 (키는 저장소에 안 넣음! 앱 첫 사용 시 폰에만 저장) ──
  const GEMINI_MODELS=["gemini-3.8-flash","gemini-3.5-flash","gemini-flash-latest"];
  const MY_CONTEXT="사용자는 투자(주식·재테크)와 건강·미용·요리·여행 등 실생활 콘텐츠 영상을 저장한다. 투자 영상이면 개인 투자자 관점(분산·장기·리스크)에서, 그 외는 실생활에 바로 적용하는 관점에서 인사이트와 액션을 제시.";
  var GK='miraenote:gk';
  function getKey(){ try{ return localStorage.getItem(GK)||''; }catch(e){ return ''; } }
  function setKey(k){ try{ if(k) localStorage.setItem(GK,k); else localStorage.removeItem(GK); }catch(e){} }
  // ─────────────────────────────────────────────────────────

  var $=function(s){return document.querySelector(s);};
  var CATS=['주식','재테크','건강(다이어트)','건강(운동)','건강(음식)','미용(홈케어)','미용(시술)','미용(메이크업)','패션뷰티','트렌드','요리','여행','기타'];
  var CATCOLOR={ '주식':'#2563eb','재테크':'#0ea5e9','건강(다이어트)':'#16a34a','건강(운동)':'#15803d','건강(음식)':'#65a30d',
    '미용(홈케어)':'#db2777','미용(시술)':'#be185d','미용(메이크업)':'#e11d48','패션뷰티':'#7c3aed','트렌드':'#d97706','요리':'#ea580c','여행':'#0d9488','기타':'#71717a' };
  function cColor(c){ return CATCOLOR[c]||'#71717a'; }
  var KEY='miraenote:v1';
  var notes=[], editingId=null, filter={status:'all',cat:'all',q:''}, sortBy='recent';
  var pick={cats:[], importance:0, status:'review', thumb:''};

  function load(){ try{ notes=JSON.parse(localStorage.getItem(KEY)||'[]'); }catch(e){ notes=[]; } }
  function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(notes)); }catch(e){} }
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
  function esc(s){ return (s||'').replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }
  function ytId(url){ var m=String(url).match(/(?:youtu\.be\/|v=|\/shorts\/|\/embed\/)([A-Za-z0-9_-]{11})/); return m?m[1]:null; }

  function renderCatPick(){ var c=$('#catPick'); c.innerHTML='';
    CATS.forEach(function(cat){ var on=pick.cats.indexOf(cat)>=0; var el=document.createElement('span');
      el.className='chip'; el.textContent=cat;
      if(on){ el.style.background=cColor(cat); el.style.color='#fff'; el.style.borderColor=cColor(cat); }
      el.onclick=function(){ var i=pick.cats.indexOf(cat); if(i>=0)pick.cats.splice(i,1); else pick.cats.push(cat); renderCatPick(); };
      c.appendChild(el); }); }
  function renderCatFilter(){ var c=$('#catFilter'); c.innerHTML='';
    var all=document.createElement('span'); all.className='chip'; all.textContent='전체 분야';
    if(filter.cat==='all'){ all.style.background='var(--accent)'; all.style.color='#fff'; all.style.borderColor='var(--accent)'; }
    all.onclick=function(){ filter.cat='all'; render(); renderCatFilter(); }; c.appendChild(all);
    CATS.forEach(function(cat){ var el=document.createElement('span'); el.className='chip'; el.textContent=cat;
      if(filter.cat===cat){ el.style.background=cColor(cat); el.style.color='#fff'; el.style.borderColor=cColor(cat); }
      el.onclick=function(){ filter.cat=cat; render(); renderCatFilter(); }; c.appendChild(el); }); }

  function renderStars(){ var s=$('#starPick'); s.dataset.v=pick.importance;
    [].forEach.call(s.children,function(sp){ sp.className=(parseInt(sp.dataset.i)<=pick.importance)?'on':''; }); }
  $('#starPick').addEventListener('click',function(e){ if(e.target.dataset.i){ var v=parseInt(e.target.dataset.i); pick.importance=(pick.importance===v)?v-1:v; renderStars(); } });
  $('#statusPick').addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b)return; pick.status=b.dataset.s;
    [].forEach.call($('#statusPick').children,function(x){ x.classList.toggle('on', x.dataset.s===pick.status); }); });

  function openForm(note){
    $('#form').style.display=''; $('#openAdd').style.display='none';
    if(note){ editingId=note.id;
      $('#n_url').value=note.url||''; $('#n_title').value=note.title||'';
      $('#n_summary').value=note.summary||''; $('#n_insight').value=note.insight||''; $('#n_action').value=note.action||''; $('#n_full').value=note.full||'';
      pick={cats:(note.cats||[]).slice(), importance:note.importance||0, status:note.status||'review', thumb:note.thumb||'', terms:(note.terms||[]).slice()};
      if(note.thumb){ $('#n_thumb').src=note.thumb; $('#n_thumb').style.display=''; } else { $('#n_thumb').style.display='none'; }
    } else { editingId=null; $('#n_url').value=''; $('#n_title').value=''; $('#n_summary').value=''; $('#n_insight').value=''; $('#n_action').value=''; $('#n_full').value='';
      pick={cats:[], importance:0, status:'review', thumb:'', terms:[]}; $('#n_thumb').style.display='none'; }
    renderTermPick();
    $('#fetchMsg').textContent=''; $('#aiMsg').textContent=''; renderCatPick(); renderStars();
    [].forEach.call($('#statusPick').children,function(x){ x.classList.toggle('on', x.dataset.s===pick.status); });
    window.scrollTo({top:0,behavior:'smooth'});
  }
  function closeForm(){ $('#form').style.display='none'; $('#openAdd').style.display=''; editingId=null; }
  $('#openAdd').onclick=function(){ openForm(null); };
  $('#cancelBtn').onclick=closeForm;

  // ✨ AI 자동정리
  $('#aiBtn').onclick=async function(){
    var url=$('#n_url').value.trim();
    if(!url){ $('#aiMsg').textContent='링크를 먼저 넣어주세요.'; return; }
    var K=getKey();
    if(!K){ K=(prompt('제미나이 API 키를 입력하세요 (이 기기에만 저장돼요):','')||'').trim(); if(K) setKey(K); }
    if(!K){ $('#aiMsg').textContent='AI 키가 필요해요 (아래 🔑 AI 키 설정).'; return; }
    $('#aiBtn').disabled=true; $('#aiMsg').textContent='AI가 영상 읽고 정리 중… (10~40초)';
    var vid=ytId(url); if(vid){ pick.thumb='https://img.youtube.com/vi/'+vid+'/hqdefault.jpg'; $('#n_thumb').src=pick.thumb; $('#n_thumb').style.display=''; }
    var apiUrl = vid ? ('https://www.youtube.com/watch?v='+vid) : url;  // 추가 파라미터 제거(MIME 오류 방지)
    var promptText='너는 영상 정리 도우미다. 아래 영상을 보고 JSON으로만 답하라(설명·마크다운·코드펜스 금지).\n사용자 맥락: '+MY_CONTEXT
      +'\n문체 규칙: 모든 텍스트는 개조식(명사형 종결)으로 짧고 핵심만. "~습니다/~이다/~합니다" 금지. 예) "총자산 대비 손실액 통제". 핵심 공식·수치가 있으면 반드시 포함(예: 최대 손실액 = 총자산 × 1%).'
      +'\n카테고리는 반드시 다음 중에서 1~2개만 고른다: '+CATS.join(', ')

        for(var attempt=0; attempt<3; attempt++){
          $('#aiMsg').textContent='AI 정리 중… ('+GEMINI_MODELS[i]+(attempt?(' 재시도'+attempt):'')+')';
          var raw='', status=0, jj=null;
          try{

            status=res.status; raw=await res.text();

            lastErr='서버 혼잡(비정상 응답 '+status+')'; await sleep(1500);
            if(attempt>=2) continue outer; else continue;
          }
          if(jj.error){ lastErr=jj.error.message||('HTTP '+status);

            if(/high demand|overload|503|500|UNAVAILABLE|try again|rate|quota|429|RESOURCE_EXHAUSTED|internal/i.test(lastErr)){ await sleep(1500); if(attempt>=2) continue outer; else continue; } // 과부하 → 재시도→다음모델
            if(/invalid|API key/i.test(lastErr)){ break outer; } // 키 문제는 멈춤(표시)
            if(/unsupported mime|mime type|not supported/i.test(lastErr)){ lastErr='이 영상은 AI가 못 읽어요(비공개·자막없음·형식). 다른 영상으로.'; break outer; }
            await sleep(1200); if(attempt>=2) continue outer; else continue; // 기타 → 재시도
          }
          j=jj; break outer; // 성공
        }
      }
      if(!j || j.error){ $('#aiMsg').textContent='오류: '+(lastErr||(j&&j.error&&j.error.message)||'키/권한 확인'); $('#aiBtn').disabled=false; return; }

      var clean=txt.replace(/```json/gi,'').replace(/```/g,'');
      var m=clean.match(/\{[\s\S]*\}/);
      if(!m){ $('#aiMsg').textContent='JSON 해석 실패 — 다시 시도해보세요'; $('#aiBtn').disabled=false; return; }

    var L=$('#slist'); L.innerHTML='';
    var arr=scraps.filter(function(sc){ if(!scrapQ) return true; return (sc.text+' '+(sc.title||'')).toLowerCase().indexOf(scrapQ)>=0; });
    $('#scount').textContent='스크랩 '+scraps.length+'개'+(scrapQ?(' · 검색 '+arr.length):'');
    if(arr.length===0){ L.innerHTML='<div class="empty">'+(scraps.length===0?'카드에서 📌로 문장을 담아보세요':'검색 결과 없음')+'</div>'; return; }
    var groups={}; arr.forEach(function(sc){ var c=sc.cat||'기타'; (groups[c]=groups[c]||[]).push(sc); });
    var order=CATS.filter(function(c){return groups[c];}); Object.keys(groups).forEach(function(c){ if(order.indexOf(c)<0) order.push(c); });
    order.forEach(function(c){
      var h=document.createElement('div'); h.innerHTML='<div style="font-weight:800;color:'+cColor(c)+';margin:14px 2px 6px;font-size:14px">'+esc(c)+' ('+groups[c].length+')</div>'; L.appendChild(h);
      groups[c].forEach(function(sc){
        var sh=(sc.title||'').slice(0,12)+((sc.title||'').length>12?'…':'');
        var el=document.createElement('div'); el.className='gitem';
        el.innerHTML='<div style="min-width:0"><div style="font-size:14px;line-height:1.65">'+esc(sc.text)+'</div>'+
          '<div style="margin-top:6px;font-size:11px;color:var(--sub)">📹 '+esc(sh||'출처')+(sc.url?' · <a target="_blank" rel="noreferrer" href="'+esc(sc.url)+'">▶ 영상</a>':'')+'</div></div>'+
          '<button class="btn sm" data-sdel="'+sc.id+'">삭제</button>';
        el.querySelector('[data-sdel]').onclick=function(){ scraps=scraps.filter(function(x){return x.id!==sc.id;}); saveScrap(); renderScrap(); };
        L.appendChild(el);
      });
    });
  }
  $('#ssearch').addEventListener('input',function(){ scrapQ=this.value.toLowerCase(); renderScrap(); });

  // 탭 전환 (노트/스크랩/용어장)
  function showTab(which){
    var isN=which==='notes', isG=which==='gloss', isS=which==='scrap';
    $('#tabNotes').classList.toggle('on',isN); $('#tabScrap').classList.toggle('on',isS); $('#tabGloss').classList.toggle('on',isG);
    $('#notesView').style.display=isN?'':'none';
    $('#scrapView').style.display=isS?'':'none';
    $('#glossView').style.display=isG?'':'none';
    ['#openAdd','#search','#statusFilter','#catFilter'].forEach(function(id){ var e=$(id); if(e) e.style.display=isN?'':'none'; });
    var tb=document.querySelector('.toolbar'); if(tb) tb.style.display=isN?'':'none';
    if(!isN){ $('#form').style.display='none'; }
    if(isG) renderGloss(); if(isS) renderScrap();
  }
  $('#tabNotes').onclick=function(){ showTab('notes'); };
  $('#tabScrap').onclick=function(){ showTab('scrap'); };
  $('#tabGloss').onclick=function(){ showTab('gloss'); };

  // 유튜브 공유 자동 처리
  function handleShare(){ var p=new URLSearchParams(location.search); var url=p.get('url')||'', text=p.get('text')||'', title=p.get('title')||'';
    if(!url && text){ var mm=text.match(/https?:\/\/[^\s]+/); if(mm) url=mm[0]; }
    if(!url) return; openForm(null); $('#n_url').value=url;
    if(title && !/https?:\/\//.test(title)) $('#n_title').value=title;
    try{ history.replaceState(null,'',location.pathname); }catch(e){} $('#fetchBtn').click(); }

  load(); loadGloss(); loadScrap(); renderCatFilter(); render(); handleShare();
})();
</script>
</body>
</html>
